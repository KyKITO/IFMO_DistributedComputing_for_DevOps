- hosts: study-ansible
  become: true
  remote_user: user
  vars:
    db_user: wordpress
    db_password: wordpress
    db_name: wordpress
    db_root_pass: root
    docker_compose_dir: "{{ ansible_user_dir }}/wordpress"
    monitoring_dir: "{{ ansible_user_dir }}/monitoring"
    db_repl_user: repl_user
    db_repl_password: repl_password
    docker_users: [ ubuntu,user ]
    mysql_port: 3306
    mysql_master_name: mysql_master
    mysql_slave_name: mysql_slave
    mysql_exp_master_name: mysql_exporter_master
    mysql_exp_slave_name: mysql_exporter_slave
  roles:
    - role: install-docker
    - role: wordpress
    - role: mysql-master
    - role: mysql-slave 
    - role: monitoring